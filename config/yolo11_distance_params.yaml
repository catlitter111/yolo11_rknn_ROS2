# YOLO11 + 距离检测系统配置文件

rknn_yolo11_node:
  ros__parameters:
    # 模型配置
    model_path: "/userdata/rknn_yolo11_ros2/model/cloth.rknn"
    
    # 话题配置
    input_topic: "/stereo/left/image_raw"
    output_topic: "/detections"
    debug_image_topic: "/yolo_debug_image"
    
    # 检测参数
    confidence_threshold: 0.25
    nms_threshold: 0.45
    
    # 调试选项
    enable_debug_image: true

intelligent_display_node:
  ros__parameters:
    # 输入话题
    input_topic: "/stereo/left/image_raw"
    detection_topic: "/detections"
    
    # 距离服务
    distance_service: "/stereo/get_distance"
    enable_distance: true
    
    # 显示配置
    window_name: "YOLO11 + 距离检测"
    font_scale: 0.7
    line_thickness: 2
    
    # 调试选项
    enable_debug: true

stereo_camera_node:
  ros__parameters:
    # 相机硬件参数
    camera_id: 1
    frame_width: 1280
    frame_height: 480
    process_width: 640
    process_height: 480
    
    # 发布参数
    publish_rate: 30.0
    camera_frame_id: "stereo_camera"
    
    # 立体匹配参数
    stereo_matcher:
      num_disparities: 96
      block_size: 15
      min_disparity: 18
      pre_filter_cap: 31
      texture_threshold: 50
      uniqueness_ratio: 18
      speckle_window_size: 83
      speckle_range: 32
      disp12_max_diff: 1
    
    # 距离约束
    distance_constraints:
      min_valid_distance: 0.2  # 米
      max_valid_distance: 5.0  # 米
    
    # 调试选项
    debug:
      enable_debug_output: false
      save_debug_images: false
      debug_image_path: "/tmp/stereo_debug" 